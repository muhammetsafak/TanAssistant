[package]
name = "tan-infra-capture"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tan-application.workspace = true
tan-domain.workspace = true
tracing.workspace = true

# Microphone on every OS; system audio on Windows (WASAPI loopback) and Linux (PulseAudio
# monitor source). The spike also uses these from `examples/`.
cpal = "0.18"
# 16-bit PCM WAV files with a durable header (`WavWriter::flush`).
hound = "3.5"
# PNG encoding of the kept frames.
image = { version = "0.25", default-features = false, features = ["png"] }

# Windows: capture frames through Windows Graphics Capture (ADR-009) instead of GDI/DXGI.
[target.'cfg(target_os = "windows")'.dependencies]
xcap = { version = "0.9", features = ["wgc"] }

# Linux: record the PulseAudio/PipeWire monitor source through the pure-Rust PulseAudio
# protocol backend of cpal (also served by pipewire-pulse), so no libpulse headers are
# needed. Frames come from xcap on X11 (xcb); on Wayland from a ScreenCast portal session
# (`ashpd`, which asks the user once to pick a source) read through PipeWire (ADR-009).
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18", features = ["pulseaudio"] }
xcap = "0.9"
# The portal client runs on zbus' own `async-io` executor, so no tokio runtime is needed;
# the futures are driven with `futures-executor::block_on` on the capture thread.
ashpd = { version = "0.14", default-features = false, features = ["async-io", "screencast"] }
pipewire = "0.10"
directories.workspace = true
futures-executor.workspace = true

# macOS 13+: system audio and screen frames through ScreenCaptureKit.
[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "11", features = ["macos_13_0"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
