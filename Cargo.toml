[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/application",
    "crates/infra-storage",
    "crates/infra-secrets",
    "crates/infra-ai",
    "crates/infra-capture",
    "crates/infra-transcription",
    "src-tauri",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
publish = false
license = "GPL-3.0-only"
repository = "https://github.com/muhammetsafak/TanAssistant"

[workspace.dependencies]
tan-domain = { path = "crates/domain" }
tan-application = { path = "crates/application" }
tan-infra-storage = { path = "crates/infra-storage" }
tan-infra-secrets = { path = "crates/infra-secrets" }
tan-infra-ai = { path = "crates/infra-ai" }
tan-infra-capture = { path = "crates/infra-capture" }
tan-infra-transcription = { path = "crates/infra-transcription" }

# Third-party (storage phase)
rusqlite = { version = "0.41", features = ["bundled"] }
directories = "6"
uuid = { version = "1", features = ["v7"] }
tempfile = "3"
futures-executor = "0.3"

# Third-party (credentials phase)
keyring = "4"
argon2 = "0.6"
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
getrandom = "0.4"
zeroize = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

# Third-party (AI phase)
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "multipart", "system-proxy"] }
tokio = "1"
base64 = "0.23"
wiremock = "0.6"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
tracing-appender = "0.2"

# Third-party (cloud transcription chunking phase)
flacenc = { version = "0.5", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }

[workspace.lints.rust]
# Platform capture adapters (later phases) need narrowly-scoped unsafe; allow it
# explicitly per module with a justification instead of forbidding it globally.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
