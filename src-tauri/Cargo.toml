[package]
name = "tan-app"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "Tan desktop application (Tauri composition root)"

[lib]
name = "tan_app_lib"
crate-type = ["rlib"]
# Tests live in tests/ (see build.rs for the Windows manifest rationale).
test = false
doctest = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tan-domain.workspace = true
tan-application.workspace = true
tan-infra-storage.workspace = true
tan-infra-secrets.workspace = true
tan-infra-ai.workspace = true
base64.workspace = true
tan-infra-capture.workspace = true
tan-infra-transcription.workspace = true
# `tray-icon`: the recording status icon and menu (Phase 08). `protocol-asset`: the webview
# shows frame images through the `asset:` protocol; its static scope is empty. At run time the
# scope gains the `frames/` folder of each session whose detail is opened (kept until exit) and
# the export file picked in the save dialog (see `commands::sessions`).
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
# The native "save as" dialog of the Markdown export (capability `dialog:allow-save` only).
tauri-plugin-dialog = "2"
# A second launch must not open a second process: it would share the database and the
# capture devices, and its startup recovery would mark the live recording as finished.
tauri-plugin-single-instance = "2"
# In-app updates (ADR-012): checks `latest.json`, downloads and verifies the signed bundle.
# The endpoint and the public key come from `tauri.conf.json` only. The plugin's JS API is not
# opened to the UI; the UI uses the typed commands of `commands::updates`.
tauri-plugin-updater = "2"
# Opens the release page in the system browser from Rust. Deliberately not registered as a
# plugin: the UI gets no opener commands (the URL is a constant in `commands::updates`).
tauri-plugin-opener = "2"
serde.workspace = true
# `tauri::generate_context!` embeds the `plugins` section of `tauri.conf.json` as JSON values.
serde_json.workspace = true
tracing.workspace = true
# The diagnostic log: daily files under `<data>/logs/` (see `logging.rs`).
tracing-subscriber.workspace = true
tracing-appender.workspace = true
# Pre-release crates: the `=` pins are required (specta APIs break between rcs).
specta = "=2.0.0-rc.26"
specta-typescript = "=0.0.13"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }

[dev-dependencies]
# The end-to-end transcription test writes WAV tracks and uses a temporary data directory.
hound = "3.5"
tempfile.workspace = true

[features]
# GPU backends of local whisper (ADR-011); a build with one uses the GPU when the machine has
# one and falls back to the CPU. Distribution builds: `vulkan` on Windows and Linux, `metal`
# on macOS. On Windows the Vulkan build needs a short CARGO_TARGET_DIR (see README).
vulkan = ["tan-infra-transcription/vulkan"]
metal = ["tan-infra-transcription/metal"]
cuda = ["tan-infra-transcription/cuda"]

[lints]
workspace = true
