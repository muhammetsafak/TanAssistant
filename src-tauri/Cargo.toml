[package]
name = "tan-app"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Tan desktop application (Tauri composition root)"

[lib]
name = "tan_app_lib"
crate-type = ["rlib"]
# Tests live in tests/ (see build.rs for the Windows manifest rationale).
test = false
doctest = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tan-domain.workspace = true
tan-application.workspace = true
tan-infra-storage.workspace = true
tan-infra-secrets.workspace = true
tan-infra-ai.workspace = true
tan-infra-capture.workspace = true
tan-infra-transcription.workspace = true
tauri = { version = "2", features = [] }
# Pre-release crates: the `=` pins are required (specta APIs break between rcs).
specta = "=2.0.0-rc.26"
specta-typescript = "=0.0.13"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }

[lints]
workspace = true
