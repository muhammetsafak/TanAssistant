name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Full debug info for every crate (whisper.cpp, Tauri, Vulkan builds) fills the runner's disk;
  # line tables are enough for CI backtraces.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  ci:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Ubuntu runner ran out of disk space during the Vulkan build; drop preinstalled
      # toolchains this project never uses.
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      # Wayland screen capture (Phase 13) reads PipeWire streams through the `pipewire` crate:
      # libpipewire-0.3-dev and libspa-0.2-dev (headers for its bindgen build) plus libclang-dev.
      # The portal client (`ashpd`) is pure Rust and needs no system library.
      - name: Install Linux system packages (Tauri / webkit2gtk / audio and screen capture)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            patchelf \
            pkg-config \
            libasound2-dev \
            libclang-dev \
            cmake \
            libxcb1-dev \
            libxrandr-dev \
            libdbus-1-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libwayland-dev \
            libegl-dev \
            libgbm-dev \
            libdrm-dev \
            libvulkan-dev \
            glslc \
            spirv-headers

      # whisper-rs builds whisper.cpp with CMake and generates its bindings with bindgen, which
      # needs libclang. Linux gets both from apt (above); macOS has libclang in the Xcode
      # command line tools; Windows needs LLVM for libclang.
      - name: Install CMake (macOS)
        if: runner.os == 'macOS'
        run: command -v cmake >/dev/null || brew install cmake

      - name: Install LLVM (libclang) and CMake (Windows)
        if: runner.os == 'Windows'
        run: |
          if [ ! -f "/c/Program Files/LLVM/bin/libclang.dll" ]; then
            choco install llvm --no-progress -y
          fi
          if ! command -v cmake >/dev/null; then
            choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' --no-progress -y
            echo 'C:\Program Files\CMake\bin' >> "$GITHUB_PATH"
          fi
          echo 'LIBCLANG_PATH=C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: Capture spike examples (build)
        run: cargo build -p tan-infra-capture --examples

      # GPU backends of local whisper (ADR-011): the distribution builds enable Vulkan on
      # Windows and Linux and Metal on macOS. The runners have no GPU, so the application is
      # built (which links the backend into a real binary) but not run on one. Vulkan also gets
      # its regression test: with the driver hidden from the loader the build must fall back
      # to the CPU instead of aborting; that test needs no GPU. Linux has its own job below.
      - name: Install the Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        run: |
          if [ -z "${VULKAN_SDK:-}" ] || [ ! -d "$(cygpath -u "$VULKAN_SDK")" ]; then
            choco install vulkan-sdk --no-progress -y
            sdk="$(ls -d /c/VulkanSDK/*/ | sort -V | tail -1)"
            echo "VULKAN_SDK=$(cygpath -w "${sdk%/}")" >> "$GITHUB_ENV"
            echo "$(cygpath -w "${sdk%/}")\\Bin" >> "$GITHUB_PATH"
          fi

      # The deployment target of the bundle (`minimumSystemVersion`; the Tauri CLI exports it):
      # below the SDK version ggml-metal's `@available` guards need the clang runtime.
      - name: Whisper GPU backend, Metal (macOS)
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: '13.0'
        run: cargo build -p tan-app --features metal

      # ggml's Vulkan shader generator nests CMake projects so deep that the default target
      # directory exceeds MAX_PATH (260 characters) on Windows: build into a short one.
      - name: Whisper GPU backend, Vulkan (Windows)
        if: runner.os == 'Windows'
        env:
          CARGO_TARGET_DIR: 'C:\t'
        run: |
          cargo build -p tan-app --features vulkan
          cargo test -p tan-infra-transcription --features vulkan --test vulkan_fallback

      - name: Dependency direction
        run: bash scripts/check-deps.sh

      - name: UI install
        run: npm --prefix ui ci

      - name: UI lint
        run: npm --prefix ui run lint

      - name: UI test
        run: npm --prefix ui test -- --run

      - name: UI build
        run: npm --prefix ui run build

      # Packaging inputs (Phase 12), checked on every push so release.yml does not discover them:
      # one version in the workspace and the UI, none in tauri.conf.json, valid macOS plists.
      - name: Bundle configuration
        run: |
          cargo_version="$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version = "\(.*\)"/\1/p;}' Cargo.toml)"
          ui_version="$(node -p "require('./ui/package.json').version")"
          echo "workspace version: $cargo_version, ui version: $ui_version"
          test -n "$cargo_version"
          if [ "$cargo_version" != "$ui_version" ]; then
            echo "::error::Cargo.toml ($cargo_version) and ui/package.json ($ui_version) disagree"
            exit 1
          fi
          if node -e "process.exit('version' in require('./src-tauri/tauri.conf.json') ? 0 : 1)"; then
            echo '::error::tauri.conf.json must not set "version" (it follows the Cargo workspace version)'
            exit 1
          fi
          if [ "$RUNNER_OS" = macOS ]; then
            plutil -lint src-tauri/Info.plist src-tauri/Entitlements.plist
          fi

      # The Tauri CLI must run from the repository root (it looks for tauri.conf.json in
      # subfolders), so call the binary installed by `npm ci` directly instead of `npm exec`.
      - name: Tauri build (debug)
        run: ./ui/node_modules/.bin/tauri build --debug --no-bundle

  # The Vulkan backend on Linux, on a runner of its own. ggml generates its Vulkan shaders with a
  # tool that skips a shader whose compilation printed anything to stderr and carries on (the
  # build "succeeds"), so a shader that failed to compile only shows up at link time as
  # `undefined symbol: matmul_id_subgroup_*_cm1_data`. The run that failed this way had the
  # workspace's whole debug build (Tauri, webkit2gtk) on the same disk and memory; here nothing
  # else runs, and the shader generator's output is checked instead of trusted.
  whisper-vulkan-linux:
    name: whisper Vulkan (ubuntu-latest)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # glslc must know GL_KHR_cooperative_matrix (ggml tests for it while configuring and builds
      # the coopmat shaders when it does): the distribution's glslc 2026.1 does, an older shaderc
      # would simply leave them out.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake libclang-dev libssl-dev pkg-config \
            libvulkan-dev glslc spirv-headers
          glslc --version
          df -h /

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # The shader generator keeps every compile's std::async future (and so the finished
      # thread's stack) until the end, then forks glslc from that ever larger process; under the
      # kernel's heuristic overcommit the late forks fail with "Failed to fork process". Let the
      # forks through: the child execs glslc at once and touches none of that memory.
      - name: Build the Vulkan backend and check the shader generator
        run: |
          set -o pipefail
          sudo sysctl -w vm.overcommit_memory=1
          cargo build -vv -p tan-infra-transcription --features vulkan 2>&1 | tee "$RUNNER_TEMP/vulkan-build.log"
          if grep -q 'cannot compile \|Error executing command for ' "$RUNNER_TEMP/vulkan-build.log"; then
            echo '::error::ggml could not compile some Vulkan shaders'
            grep -n -A12 'cannot compile \|Error executing command for ' "$RUNNER_TEMP/vulkan-build.log" | head -100
            exit 1
          fi
          df -h /

      # Links the backend into a real binary and runs the "no Vulkan driver" regression test.
      - name: Vulkan fallback test
        run: cargo test -p tan-infra-transcription --features vulkan --test vulkan_fallback

  # Known vulnerabilities (RustSec advisory database) in the locked Rust dependency tree. The
  # official cargo-audit is built from crates.io at a fixed version instead of a third-party
  # action, so no extra token or permission is needed. Vulnerabilities fail the job;
  # "unmaintained" warnings (Tauri's GTK 3 bindings on Linux) are reported but do not.
  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Audit Cargo.lock
        run: cargo audit
