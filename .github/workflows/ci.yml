name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Linux system packages (Tauri / webkit2gtk / audio and screen capture)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            patchelf \
            pkg-config \
            libasound2-dev \
            libclang-dev \
            cmake \
            libxcb1-dev \
            libxrandr-dev \
            libdbus-1-dev \
            libpipewire-0.3-dev \
            libwayland-dev \
            libegl-dev \
            libgbm-dev \
            libdrm-dev \
            libvulkan-dev \
            glslc \
            spirv-headers

      # whisper-rs builds whisper.cpp with CMake and generates its bindings with bindgen, which
      # needs libclang. Linux gets both from apt (above); macOS has libclang in the Xcode
      # command line tools; Windows needs LLVM for libclang.
      - name: Install CMake (macOS)
        if: runner.os == 'macOS'
        run: command -v cmake >/dev/null || brew install cmake

      - name: Install LLVM (libclang) and CMake (Windows)
        if: runner.os == 'Windows'
        run: |
          if [ ! -f "/c/Program Files/LLVM/bin/libclang.dll" ]; then
            choco install llvm --no-progress -y
          fi
          if ! command -v cmake >/dev/null; then
            choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' --no-progress -y
            echo 'C:\Program Files\CMake\bin' >> "$GITHUB_PATH"
          fi
          echo 'LIBCLANG_PATH=C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: Capture spike examples (build)
        run: cargo build -p tan-infra-capture --examples

      # GPU backends of local whisper (ADR-011): the distribution builds enable Vulkan on
      # Windows and Linux and Metal on macOS. The runners have no GPU, so the application is
      # built (which links the backend into a real binary) but not run on one. Vulkan also gets
      # its regression test: with the driver hidden from the loader the build must fall back
      # to the CPU instead of aborting; that test needs no GPU.
      - name: Install the Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        run: |
          if [ -z "${VULKAN_SDK:-}" ] || [ ! -d "$(cygpath -u "$VULKAN_SDK")" ]; then
            choco install vulkan-sdk --no-progress -y
            sdk="$(ls -d /c/VulkanSDK/*/ | sort -V | tail -1)"
            echo "VULKAN_SDK=$(cygpath -w "${sdk%/}")" >> "$GITHUB_ENV"
            echo "$(cygpath -w "${sdk%/}")\\Bin" >> "$GITHUB_PATH"
          fi

      - name: Whisper GPU backend, Vulkan (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build -p tan-app --features vulkan
          cargo test -p tan-infra-transcription --features vulkan --test vulkan_fallback

      - name: Whisper GPU backend, Metal (macOS)
        if: runner.os == 'macOS'
        run: cargo build -p tan-app --features metal

      # ggml's Vulkan shader generator nests CMake projects so deep that the default target
      # directory exceeds MAX_PATH (260 characters) on Windows: build into a short one.
      - name: Whisper GPU backend, Vulkan (Windows)
        if: runner.os == 'Windows'
        env:
          CARGO_TARGET_DIR: 'C:\t'
        run: |
          cargo build -p tan-app --features vulkan
          cargo test -p tan-infra-transcription --features vulkan --test vulkan_fallback

      - name: Dependency direction
        run: bash scripts/check-deps.sh

      - name: UI install
        run: npm --prefix ui ci

      - name: UI lint
        run: npm --prefix ui run lint

      - name: UI test
        run: npm --prefix ui test -- --run

      - name: UI build
        run: npm --prefix ui run build

      # The Tauri CLI must run from the repository root (it looks for tauri.conf.json in
      # subfolders), so call the binary installed by `npm ci` directly instead of `npm exec`.
      - name: Tauri build (debug)
        run: ./ui/node_modules/.bin/tauri build --debug --no-bundle
