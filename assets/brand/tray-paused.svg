<?xml version="1.0" encoding="UTF-8"?>
<!-- Tan menu bar icon while paused: template silhouette with a two-bar pause badge bottom right. -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" role="img" aria-label="Tan menu bar icon, paused" style="color:#000">
  <defs>
    <mask id="silhouette" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
      <rect width="24" height="24" fill="#fff" />
      <rect x="10.2" y="15" width="3.6" height="4" rx="0.8" fill="#000" />
      <circle cx="18.5" cy="18.5" r="6.6" fill="#000" />
    </mask>
    <mask id="badge" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
      <circle cx="18.5" cy="18.5" r="5.4" fill="#fff" />
      <rect x="16.2" y="15.9" width="1.7" height="5.2" rx="0.5" fill="#000" />
      <rect x="19.1" y="15.9" width="1.7" height="5.2" rx="0.5" fill="#000" />
    </mask>
  </defs>
  <g mask="url(#silhouette)" fill="currentColor">
    <circle cx="6" cy="6" r="3" />
    <circle cx="18" cy="6" r="3" />
    <path d="M12 4 C 18 4 20 9 20 13 C 20 18 16.5 21 12 21 C 7.5 21 4 18 4 13 C 4 9 6 4 12 4 Z" />
  </g>
  <circle cx="18.5" cy="18.5" r="5.4" fill="currentColor" mask="url(#badge)" />
</svg>
